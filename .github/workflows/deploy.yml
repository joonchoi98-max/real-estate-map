name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/seongdong-real-estate-map-qJKoK
      - main
  schedule:
    - cron: "0 0 1 * *"   # monthly refresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write   # required for enablement: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch MOLIT real-estate data
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python fetch_data.py

      - name: Prepare site files
        run: |
          mkdir dist
          cp index.html dist/
          cp data.json dist/
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
