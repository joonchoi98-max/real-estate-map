<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성동구 연립다세대 실거래가</title>
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d43492daba36a536335061559d4dea27&libraries=services,clusterer&autoload=false"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155; --muted: #475569;
      --text: #e2e8f0; --subtext: #94a3b8; --accent: #38bdf8;
      --green: #22c55e; --yellow: #f59e0b; --orange: #f97316; --red: #ef4444;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif; font-size: 14px; display: flex; flex-direction: column; }
    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 56px; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 12px;
    }
    #header h1 { font-size: 16px; font-weight: 700; white-space: nowrap; }
    #header h1 span { color: var(--accent); }
    #controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer;
    }
    #stats-bar {
      display: flex; gap: 16px; align-items: center;
      padding: 0 16px; height: 40px; background: var(--bg);
      border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto;
    }
    .stat { display: flex; gap: 6px; align-items: center; white-space: nowrap; color: var(--subtext); font-size: 12px; }
    .stat strong { color: var(--text); font-size: 13px; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #map-wrap { flex: 1; position: relative; min-width: 0; }
    #map { width: 100%; height: 100%; }
    #legend {
      position: absolute; bottom: 16px; left: 16px; z-index: 10;
      background: rgba(15,23,42,.88); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--subtext); }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    #panel {
      width: 360px; flex-shrink: 0; background: var(--surface);
      border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
    }
    #panel-header {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    #panel-header h2 { font-size: 13px; font-weight: 600; color: var(--subtext); text-transform: uppercase; letter-spacing: .5px; }
    #count-badge { background: var(--accent); color: #0f172a; font-size: 11px; font-weight: 700; border-radius: 20px; padding: 2px 8px; }
    #dong-filter { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }
    .dong-btn {
      padding: 3px 10px; font-size: 12px; border-radius: 20px;
      background: var(--bg); border: 1px solid var(--border); color: var(--subtext);
      cursor: pointer; white-space: nowrap;
    }
    .dong-btn:hover { border-color: var(--accent); color: var(--accent); }
    .dong-btn.active { background: var(--accent); border-color: var(--accent); color: #0f172a; font-weight: 600; }
    #list { overflow-y: auto; flex: 1; }
    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .tx-item {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .15s;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .tx-item:hover { background: rgba(56,189,248,.06); }
    .tx-item.selected { background: rgba(56,189,248,.12); border-left: 3px solid var(--accent); padding-left: 13px; }
    .price-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .tx-body { flex: 1; min-width: 0; }
    .tx-name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-meta { font-size: 12px; color: var(--subtext); margin-top: 2px; }
    .tx-price { font-weight: 700; font-size: 15px; margin-top: 4px; }
    .tx-detail { font-size: 11px; color: var(--muted); margin-top: 2px; }
    #overlay {
      position: fixed; inset: 0; z-index: 9999; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #overlay.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #overlay p { color: var(--subtext); font-size: 14px; }
    .info-box { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px 14px; min-width: 200px; max-width: 260px; box-shadow: 0 8px 24px rgba(0,0,0,.6); font-family: 'Segoe UI', sans-serif; }
    .ib-name { font-weight: 700; font-size: 14px; color: #e2e8f0; margin-bottom: 6px; }
    #empty { padding: 48px 24px; text-align: center; color: var(--muted); display: none; }
    #error-bar { display: none; padding: 10px 16px; background: rgba(239,68,68,.15); border-bottom: 1px solid rgba(239,68,68,.4); color: #fca5a5; font-size: 13px; }
    @media (max-width: 768px) {
      #main { flex-direction: column; }
      #map-wrap { height: 55vw; min-height: 240px; flex: none; }
      #panel { width: 100%; border-left: none; border-top: 1px solid var(--border); flex: 1; }
    }
  </style>
</head>
<body>

<div id="overlay"><div class="spinner"></div><p id="overlay-msg">지도 로딩 중…</p></div>
<div id="error-bar"></div>

<header id="header">
  <h1>성동구 <span>연립다세대</span> 실거래가</h1>
  <div id="controls">
    <select id="sort-sel">
      <option value="date">최신순</option>
      <option value="price-desc">가격 높은순</option>
      <option value="price-asc">가격 낮은순</option>
      <option value="area">면적 넓은순</option>
    </select>
    <select id="month-sel">
      <option value="0">전체 기간</option>
      <option value="1">최근 1개월</option>
      <option value="3">최근 3개월</option>
      <option value="6">최근 6개월</option>
    </select>
  </div>
</header>

<div id="stats-bar">
  <div class="stat">거래 건수 <strong id="s-count">-</strong></div>
  <div class="stat">평균가 <strong id="s-avg">-</strong></div>
  <div class="stat">최고가 <strong id="s-max">-</strong></div>
  <div class="stat">최저가 <strong id="s-min">-</strong></div>
  <div class="stat">평균 전용 <strong id="s-area">-</strong></div>
</div>

<div id="main">
  <div id="map-wrap">
    <div id="map"></div>
    <div id="legend">
      <div class="legend-row"><div class="dot" style="background:var(--red)"></div> 10억 초과</div>
      <div class="legend-row"><div class="dot" style="background:var(--orange)"></div> 6억~10억</div>
      <div class="legend-row"><div class="dot" style="background:var(--yellow)"></div> 3억~6억</div>
      <div class="legend-row"><div class="dot" style="background:var(--green)"></div> 3억 미만</div>
    </div>
  </div>
  <div id="panel">
    <div id="panel-header">
      <h2>거래 목록</h2>
      <span id="count-badge">0</span>
    </div>
    <div id="dong-filter"></div>
    <div id="list"><div id="empty">조건에 맞는 거래가 없습니다</div></div>
  </div>
</div>

<script>
// ── 유틸 ─────────────────────────────────────────────────────────────
function parsePrice(str) { return parseInt(String(str||'').replace(/,/g,''),10)||0; }
function formatPrice(m) {
  if (!m) return '–';
  const e=Math.floor(m/10000), r=m%10000;
  if (e&&r) return `${e}억 ${r.toLocaleString()}만`;
  if (e) return `${e}억`;
  return `${m.toLocaleString()}만원`;
}
function pcolor(m) {
  if (m>=100000) return 'var(--red)';
  if (m>=60000)  return 'var(--orange)';
  if (m>=30000)  return 'var(--yellow)';
  return 'var(--green)';
}
function txDate(tx) {
  return tx.dealYear ? `${tx.dealYear}.${String(tx.dealMonth||'').padStart(2,'0')}.${String(tx.dealDay||'').padStart(2,'0')}` : '–';
}
function txDateNum(tx) { return (tx.dealYear||0)*10000+(tx.dealMonth||0)*100+(tx.dealDay||0); }
function txMonthsAgo(tx) {
  const n=new Date();
  return (n.getFullYear()-(tx.dealYear||0))*12+(n.getMonth()+1-(tx.dealMonth||0));
}
function addrOf(tx) { return `${(tx.umdNm||'').trim()} ${(tx.jibun||'').trim()}`; }
function setMsg(t) { document.getElementById('overlay-msg').textContent=t; }
function hideOverlay() { document.getElementById('overlay').classList.add('hidden'); }
function showError(msg) { const b=document.getElementById('error-bar'); b.textContent=msg; b.style.display='block'; }

// ── 상태 ─────────────────────────────────────────────────────────────
let allData=[], filtered=[], markers=[], clusterer=null;
let geocodeCache={}, openIW=null, selectedItem=null, activeDong='전체';
let map=null, geocoder=null;

// ── 카카오맵 로드 후 시작 ─────────────────────────────────────────────
kakao.maps.load(function() {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(37.5633, 127.0371), level: 5
  });
  geocoder = new kakao.maps.services.Geocoder();
  clusterer = new kakao.maps.MarkerClusterer({
    map, averageCenter: true, minLevel: 4,
    styles: [{ width:'42px', height:'42px', background:'rgba(56,189,248,.85)',
      borderRadius:'50%', color:'#0f172a', fontWeight:'700', fontSize:'14px',
      textAlign:'center', lineHeight:'42px', border:'2px solid rgba(255,255,255,.4)' }]
  });
  kakao.maps.event.addListener(map, 'click', ()=>{ if(openIW){openIW.close();openIW=null;} });
  loadData();
});

// ── 마커 이미지 ───────────────────────────────────────────────────────
function makeMarkerImage(color) {
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><circle cx="14" cy="14" r="11" fill="${color}" stroke="rgba(255,255,255,0.7)" stroke-width="2"/></svg>`;
  return new kakao.maps.MarkerImage(
    'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg))),
    new kakao.maps.Size(28,28), {offset:new kakao.maps.Point(14,14)}
  );
}

// ── 데이터 로드 ───────────────────────────────────────────────────────
async function loadData() {
  setMsg('거래 데이터 불러오는 중…');
  try {
    const res = await fetch('./data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allData = await res.json();
    if (!Array.isArray(allData)) throw new Error('형식 오류');
  } catch(e) {
    hideOverlay();
    showError(`데이터 로드 실패: ${e.message}`);
    return;
  }
  const DONGS = new Set();
  allData.forEach(tx => { const d=(tx.umdNm||'').trim(); if(d) DONGS.add(d); });
  buildDongFilter([...DONGS].sort());
  applyFilters();
  await geocodeAll();
  buildMarkers();
  renderList();
  hideOverlay();
}

// ── 동 필터 ───────────────────────────────────────────────────────────
function buildDongFilter(dongs) {
  const wrap=document.getElementById('dong-filter');
  const mkBtn=(label,val)=>{
    const b=document.createElement('button');
    b.className='dong-btn'+(val==='전체'?' active':'');
    b.textContent=label; b.dataset.dong=val;
    wrap.appendChild(b);
  };
  mkBtn('전체','전체');
  dongs.forEach(d=>mkBtn(d,d));
  wrap.addEventListener('click', e=>{
    const btn=e.target.closest('.dong-btn'); if(!btn) return;
    wrap.querySelectorAll('.dong-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); activeDong=btn.dataset.dong;
    applyFilters(); renderList(); updateVis();
  });
}

// ── 필터/통계 ─────────────────────────────────────────────────────────
function applyFilters() {
  const months=parseInt(document.getElementById('month-sel').value);
  const sort=document.getElementById('sort-sel').value;
  filtered=allData.filter(tx=>{
    if (activeDong!=='전체'&&(tx.umdNm||'').trim()!==activeDong) return false;
    if (months>0&&txMonthsAgo(tx)>months) return false;
    return true;
  });
  if (sort==='date')       filtered.sort((a,b)=>txDateNum(b)-txDateNum(a));
  else if (sort==='price-desc') filtered.sort((a,b)=>parsePrice(b.dealAmount)-parsePrice(a.dealAmount));
  else if (sort==='price-asc')  filtered.sort((a,b)=>parsePrice(a.dealAmount)-parsePrice(b.dealAmount));
  else if (sort==='area')  filtered.sort((a,b)=>parseFloat(b.excluUseAr||0)-parseFloat(a.excluUseAr||0));
  const prices=filtered.map(tx=>parsePrice(tx.dealAmount)).filter(Boolean);
  const areas=filtered.map(tx=>parseFloat(tx.excluUseAr||0)).filter(Boolean);
  document.getElementById('s-count').textContent=filtered.length.toLocaleString()+'건';
  document.getElementById('s-avg').textContent=prices.length?formatPrice(Math.round(prices.reduce((a,b)=>a+b)/prices.length)):'–';
  document.getElementById('s-max').textContent=prices.length?formatPrice(Math.max(...prices)):'–';
  document.getElementById('s-min').textContent=prices.length?formatPrice(Math.min(...prices)):'–';
  document.getElementById('s-area').textContent=areas.length?(areas.reduce((a,b)=>a+b)/areas.length).toFixed(1)+'㎡':'–';
  document.getElementById('count-badge').textContent=filtered.length.toLocaleString();
}

// ── 지오코딩 ─────────────────────────────────────────────────────────
function geoAddr(addr) {
  return new Promise(res=>{
    if (geocodeCache[addr]!==undefined){res(geocodeCache[addr]);return;}
    geocoder.addressSearch(`서울특별시 성동구 ${addr}`,(result,status)=>{
      const v=status===kakao.maps.services.Status.OK?{lat:parseFloat(result[0].y),lng:parseFloat(result[0].x)}:null;
      geocodeCache[addr]=v; res(v);
    });
  });
}
async function geocodeAll() {
  const addrs=[...new Set(allData.map(addrOf))];
  const total=addrs.length, BATCH=10;
  for (let i=0;i<addrs.length;i+=BATCH) {
    await Promise.all(addrs.slice(i,i+BATCH).map(geoAddr));
    setMsg(`주소 변환 중… ${Math.min(i+BATCH,total)} / ${total}`);
    if (i+BATCH<addrs.length) await new Promise(r=>setTimeout(r,80));
  }
}

// ── 마커 ─────────────────────────────────────────────────────────────
function buildMarkers() {
  clusterer.clear(); markers=[];
  const groups={};
  allData.forEach(tx=>{
    const k=addrOf(tx); if(!geocodeCache[k]) return;
    (groups[k]=groups[k]||[]).push(tx);
  });
  Object.entries(groups).forEach(([addr,txns])=>{
    const c=geocodeCache[addr]; if(!c) return;
    const maxP=Math.max(...txns.map(tx=>parsePrice(tx.dealAmount)));
    const mk=new kakao.maps.Marker({position:new kakao.maps.LatLng(c.lat,c.lng),image:makeMarkerImage(pcolor(maxP))});
    kakao.maps.event.addListener(mk,'click',()=>{
      openIWGroup(txns,c);
      const idx=filtered.findIndex(tx=>addrOf(tx)===addr);
      if(idx>=0) selItem(idx,false);
    });
    markers.push({mk,addr});
  });
  updateVis();
}
function updateVis() {
  const vis=new Set(filtered.map(addrOf));
  clusterer.clear();
  clusterer.addMarkers(markers.filter(({addr})=>vis.has(addr)).map(({mk})=>mk));
}

// ── 정보창 ────────────────────────────────────────────────────────────
function openIWGroup(txns,c) {
  if(openIW) openIW.close();
  const rows=[...txns].sort((a,b)=>txDateNum(b)-txDateNum(a)).slice(0,3).map(tx=>{
    const price=parsePrice(tx.dealAmount),col=pcolor(price);
    return `<div style="margin-top:6px;padding-top:6px;border-top:1px solid #334155">
      <div style="color:${col};font-weight:700;font-size:15px">${formatPrice(price)}</div>
      <div style="color:#94a3b8;font-size:11px;margin-top:2px">${parseFloat(tx.excluUseAr||0)}㎡ · ${tx.floor||'–'}층 · ${txDate(tx)}</div>
    </div>`;
  }).join('');
  const more=txns.length>3?`<div style="color:var(--accent);font-size:11px;margin-top:6px">외 ${txns.length-3}건</div>`:'';
  const content=`<div class="info-box">
    <div class="ib-name">${(txns[0].mhouseNm||'').trim()||'(이름 없음)'}</div>
    <div style="color:#94a3b8;font-size:12px;margin-bottom:4px">성동구 ${(txns[0].umdNm||'').trim()}</div>
    ${rows}${more}
  </div>`;
  openIW=new kakao.maps.InfoWindow({content,removable:true,zIndex:1});
  openIW.open(map,new kakao.maps.Marker({position:new kakao.maps.LatLng(c.lat,c.lng)}));
}

// ── 목록 ─────────────────────────────────────────────────────────────
function renderList() {
  const list=document.getElementById('list');
  list.querySelectorAll('.tx-item').forEach(el=>el.remove());
  document.getElementById('empty').style.display=filtered.length?'none':'block';
  const frag=document.createDocumentFragment();
  filtered.forEach((tx,idx)=>{
    const price=parsePrice(tx.dealAmount),col=pcolor(price);
    const div=document.createElement('div');
    div.className='tx-item'; div.dataset.idx=idx;
    div.innerHTML=`
      <div class="price-dot" style="background:${col}"></div>
      <div class="tx-body">
        <div class="tx-name">${(tx.mhouseNm||'').trim()||'(이름 없음)'}</div>
        <div class="tx-meta">${(tx.umdNm||'').trim()} ${(tx.jibun||'').trim()}</div>
        <div class="tx-price" style="color:${col}">${formatPrice(price)}</div>
        <div class="tx-detail">${parseFloat(tx.excluUseAr||0)}㎡ · ${tx.floor||'–'}층 · ${tx.buildYear||'–'}년 · ${txDate(tx)}</div>
      </div>`;
    div.addEventListener('click',()=>selItem(idx,true));
    frag.appendChild(div);
  });
  list.appendChild(frag);
}
function selItem(idx,pan) {
  if(selectedItem!==null) document.querySelector(`.tx-item[data-idx="${selectedItem}"]`)?.classList.remove('selected');
  selectedItem=idx;
  const el=document.querySelector(`.tx-item[data-idx="${idx}"]`);
  if(el){el.classList.add('selected');el.scrollIntoView({block:'nearest'});}
  if(pan){
    const c=geocodeCache[addrOf(filtered[idx])];
    if(c){map.panTo(new kakao.maps.LatLng(c.lat,c.lng));openIWGroup([filtered[idx]],c);}
  }
}

document.getElementById('sort-sel').addEventListener('change',()=>{applyFilters();renderList();updateVis();});
document.getElementById('month-sel').addEventListener('change',()=>{applyFilters();renderList();updateVis();});
</script>
</body>
</html>
